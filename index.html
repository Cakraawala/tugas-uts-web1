<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Toko Buku Cakra</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body id="halaman-login">
    <header>
        <div class="header-isi">
            <p class="nama-toko"><img src="assets/logo.png" alt="Logo Toko Buku Cakra" class="logo"> Toko Buku Cakra</p>
        </div>
    </header>

    <main>
        <section class="kotak-login">
            <h1>Login</h1>
            <!-- CSS inline -->
            <p style="color: #666666; font-size: 14px; margin-top: -8px;">Silakan masuk menggunakan akun Anda.</p>

            <form id="formLogin" novalidate>
                <div class="form-baris">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="contoh@gmail.com">
                </div>
                <div class="form-baris">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Password">
                </div>
                <!-- CSS inline -->
                <button type="submit" style="width: 100%;">Login</button>
            </form>

            <div class="link-bawah">
                <button type="button" class="tombol-link" id="tombolLupa">Lupa Password</button>
                |
                <button type="button" class="tombol-link" id="tombolDaftar">Daftar</button>
            </div>
        </section>
    </main>

    <!-- Modal Lupa Password -->
    <div class="modal" id="modalLupa">
        <div class="modal-isi">
            <h2>Lupa Password</h2>
            <form id="formLupa" novalidate>
                <div class="form-baris">
                    <label for="lupaEmail">Email terdaftar</label>
                    <input type="email" id="lupaEmail" placeholder="contoh@gmail.com">
                </div>
                <div class="modal-tombol">
                    <button type="button" class="tombol-abu" id="tutupLupa">Tutup</button>
                    <button type="submit">Kirim</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Daftar -->
    <div class="modal" id="modalDaftar">
        <div class="modal-isi">
            <h2>Daftar Akun</h2>
            <form id="formDaftar" novalidate>
                <div class="form-baris">
                    <label for="daftarNama">Nama Lengkap</label>
                    <input type="text" id="daftarNama">
                </div>
                <div class="form-baris">
                    <label for="daftarEmail">Email</label>
                    <input type="email" id="daftarEmail">
                </div>
                <div class="form-baris">
                    <label for="daftarPassword">Password</label>
                    <input type="password" id="daftarPassword">
                </div>
                <div class="modal-tombol">
                    <button type="button" class="tombol-abu" id="tutupDaftar">Tutup</button>
                    <button type="submit">Daftar</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        &copy; 2026 Toko Buku Cakra - Tugas UTS Pemrograman Web 1
    </footer>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
